<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="高小蓉的工作台">
<meta name="theme-color" content="#185FA5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23185FA5'/><text x='50' y='70' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>蓉</text></svg>">
<title>高小蓉的工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--blue-50:#E6F1FB;--blue-100:#B5D4F4;--blue-200:#85B7EB;--blue-400:#378ADD;--blue-600:#185FA5;--blue-800:#0C447C;
--teal-50:#E1F5EE;--teal-100:#9FE1CB;--teal-200:#5DCAA5;--teal-400:#1D9E75;--teal-600:#0F6E56;--teal-800:#085041;
--coral-50:#FAECE7;--coral-100:#F5C4B3;--coral-200:#F0997B;--coral-400:#D85A30;--coral-600:#993C1D;--coral-800:#712B13;
--red-50:#FCEBEB;--red-200:#F09595;--red-400:#E24B4A;--red-600:#A32D2D;
--amber-50:#FAEEDA;--amber-200:#EF9F27;--amber-400:#BA7517;--amber-600:#854F0B;
--gray-50:#F1EFE8;--gray-100:#D3D1C7;--gray-200:#B4B2A9;--gray-400:#888780;--gray-600:#5F5E5A;--gray-800:#444441;--gray-900:#2C2C2A;
--bg:#F8F7F4;--surface:#FFFFFF;--surface-2:#F8F7F4;--surface-3:#F1EFE8;
--text:#2C2C2A;--text-2:#5F5E5A;--text-3:#888780;
--border:#E0DED5;--border-2:#B4B2A9;
--radius:8px;--radius-lg:12px;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
}
body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:16px;font-weight:600}
.topbar-date{font-size:13px;color:var(--text-2)}
.topbar-badge{background:var(--red-50);color:var(--red-600);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.btn-add{background:var(--blue-600);color:#fff;border:none;border-radius:var(--radius);padding:6px 14px;font-size:13px;cursor:pointer;font-weight:500;font-family:var(--font)}
.btn-add:hover{background:var(--blue-800)}
.app-body{display:grid;grid-template-columns:160px 1fr 240px;min-height:calc(100vh - 47px)}
.sidebar{background:var(--surface-2);border-right:1px solid var(--border);padding:12px 8px}
.nav-header{font-size:11px;color:var(--text-3);margin:12px 4px 4px;font-weight:500}
.nav-header:first-child{margin-top:0}
.nav-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.nav-item{font-size:13px;color:var(--text-2);padding:6px 10px;border-radius:var(--radius);cursor:pointer}
.nav-item:hover{background:var(--surface-3)}
.nav-item.active{background:var(--blue-50);color:var(--blue-800);font-weight:500}
.main{padding:20px;overflow-y:auto}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.task-card{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.task-card:hover{border-color:var(--border-2)}
.task-card.done{opacity:.55}
.task-checkbox{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--gray-400);cursor:pointer;flex-shrink:0;appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:center;background:transparent}
.task-checkbox:checked{border-color:var(--blue-600)}
.task-card[data-module="work"] .task-checkbox:checked{background:var(--blue-600)}
.task-card[data-module="children"] .task-checkbox:checked{background:var(--teal-600);border-color:var(--teal-600)}
.task-card[data-module="life"] .task-checkbox:checked{background:var(--coral-600);border-color:var(--coral-600)}
.task-checkbox:checked::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
.task-tag{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:500;white-space:nowrap;flex-shrink:0}
.tag-work{background:var(--blue-50);color:var(--blue-800)}
.tag-children{background:var(--teal-50);color:var(--teal-800)}
.tag-life{background:var(--coral-50);color:var(--coral-800)}
.task-title{flex:1;font-size:13px}
.task-card.done .task-title{text-decoration:line-through;color:var(--text-3)}
.task-meta{font-size:11px;color:var(--text-3);flex-shrink:0;white-space:nowrap}
.task-meta.urgent{color:var(--red-600);font-weight:500}
.task-delete{width:22px;height:22px;border:none;background:transparent;color:var(--text-3);cursor:pointer;border-radius:4px;font-size:16px;flex-shrink:0;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center}
.task-card:hover .task-delete{opacity:1}
.task-delete:hover{background:var(--red-50);color:var(--red-600)}
.task-edit{width:22px;height:22px;border:none;background:transparent;color:var(--text-3);cursor:pointer;border-radius:4px;font-size:14px;flex-shrink:0;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center}
.task-card:hover .task-edit{opacity:1}
.task-edit:hover{background:var(--blue-50);color:var(--blue-600)}
.right-panel{background:var(--surface-2);border-left:1px solid var(--border);padding:16px 14px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.stat-number{font-size:26px;font-weight:600;line-height:1.2}
.stat-label{font-size:12px;color:var(--text-3)}
.stat-bar{display:flex;gap:0;height:10px;border-radius:5px;overflow:hidden;margin-top:8px}
.stat-bar>div{height:100%;transition:flex .3s ease}
.stat-legend{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:11px}
.reminder-card{background:var(--amber-50);border:1px solid var(--amber-200);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.reminder-title{font-size:12px;font-weight:600;color:var(--amber-600);margin-bottom:6px}
.reminder-item{font-size:12px;color:var(--text-2);margin-bottom:4px;line-height:1.5}
.calendar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.calendar-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.calendar-title{font-size:15px;font-weight:600}
.calendar-nav{display:flex;gap:4px}
.calendar-nav button{border:1px solid var(--border);background:transparent;border-radius:var(--radius);width:28px;height:28px;cursor:pointer;font-size:14px;color:var(--text-2);font-family:var(--font)}
.calendar-nav button:hover{background:var(--surface-3)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.calendar-day-header{text-align:center;font-size:11px;color:var(--text-3);font-weight:500;padding:6px 0;border-bottom:1px solid var(--border)}
.calendar-day{min-height:48px;display:flex;flex-direction:column;align-items:center;padding-top:4px;font-size:12px;color:var(--text-2);cursor:pointer;border:0.5px solid var(--border);position:relative}
.calendar-day:hover{background:var(--surface-3)}
.calendar-day.other-month{color:var(--text-3);opacity:.4}
.calendar-day.today{background:var(--blue-50);color:var(--blue-600);font-weight:600}
.calendar-day.has-tasks::after{content:'';position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--coral-400)}
.calendar-day.selected{background:var(--blue-100)}
.mobile-stats{display:none;text-align:center;font-size:12px;color:var(--text-3);padding:12px;margin-top:8px;background:var(--surface);border-radius:var(--radius)}
.progress-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-top:14px}
.progress-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.progress-label{font-size:13px;font-weight:600;color:var(--text)}
.progress-percent{font-size:22px;font-weight:700;color:var(--blue-600);line-height:1}
.progress-percent .progress-total{font-size:13px;font-weight:400;color:var(--text-3)}
.progress-track{height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,#378ADD,#185FA5)}
.progress-fill.complete{background:linear-gradient(90deg,#1D9E75,#0F6E56)}
.progress-info{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:6px}
.progress-info .done{color:var(--teal-600);font-weight:500}
.filter-chips{display:none;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-chip{font-size:12px;padding:3px 10px;border-radius:14px;border:1px solid var(--border);cursor:pointer;color:var(--text-2)}
.filter-chip.active{font-weight:500}
.date-filter-bar{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.date-filter-chip{font-size:13px;padding:5px 14px;border-radius:16px;border:1px solid var(--border);cursor:pointer;color:var(--text-2);background:var(--surface);transition:all .15s}
.date-filter-chip.active{background:var(--blue-50);border-color:var(--blue-400);color:var(--blue-600);font-weight:500}
.date-filter-chip:hover:not(.active){background:var(--surface-3)}
.date-filter-picker{font-size:13px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);color:var(--text-2);max-width:150px}
.date-filter-picker:focus{outline:none;border-color:var(--blue-400)}
/* Delete confirm popup for recurring tasks */
.delete-confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.delete-confirm-popup{background:var(--surface);border-radius:var(--radius-lg);padding:20px 24px;max-width:320px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center}
.delete-confirm-popup .dcp-title{font-size:14px;font-weight:500;margin-bottom:6px}
.delete-confirm-popup .dcp-sub{font-size:12px;color:var(--text-3);margin-bottom:16px;line-height:1.5}
.delete-confirm-popup .dcp-btns{display:flex;gap:10px}
.delete-confirm-popup .dcp-btn{flex:1;padding:10px 0;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;transition:opacity .15s}
.delete-confirm-popup .dcp-btn:hover{opacity:.85}
.dcp-btn-skip{background:var(--blue-50);color:var(--blue-700)}
.dcp-btn-cancel{background:var(--red-50);color:var(--red-700)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.year-selector{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.yr-btn{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:5px 12px;cursor:pointer;font-size:12px;color:var(--text-2);font-family:var(--font)}
.yr-btn:hover{background:var(--surface-3)}
.yr-label{font-size:15px;font-weight:600;color:var(--text)}
.yr-add{margin-left:auto;border-color:var(--blue-400);color:var(--blue-600)}
.yr-add:hover{background:var(--blue-50)}
.plan-card{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:12px 14px;margin-bottom:10px}
.plan-card.ylevel{border-left:4px solid var(--blue-600);background:var(--blue-50)}
.plan-card.mlevel{border-left:4px solid var(--teal-600);background:var(--teal-50)}
.plan-card.wlevel{border-left:4px solid var(--coral-400);background:var(--coral-50)}
.plan-row{display:flex;align-items:center;gap:8px}
.plan-toggle-arrow{font-size:10px;color:var(--text-3);cursor:pointer;padding:2px;min-width:16px;text-align:center;border:none;background:none;font-family:var(--font)}
.plan-title{font-size:13px;font-weight:500;color:var(--text);flex:1}
.plan-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500;flex-shrink:0}
.plan-status.done{background:var(--teal-100);color:var(--teal-800)}
.plan-status.prog{background:var(--blue-100);color:var(--blue-800)}
.plan-status.pend{background:var(--gray-100);color:var(--text-2)}
.plan-desc{font-size:12px;color:var(--text-2);line-height:1.5;margin-top:6px;white-space:pre-wrap}
.plan-progress{display:flex;align-items:center;gap:8px;margin-top:10px}
.plan-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.plan-fill{height:6px;background:var(--teal-400);border-radius:3px;transition:width .3s}
.plan-pct{font-size:11px;color:var(--text-2);min-width:36px}
.plan-edit,.plan-delete{font-size:14px;cursor:pointer;border:none;background:none;color:var(--text-3);padding:2px 4px;font-family:var(--font);flex-shrink:0}
.plan-edit:hover{color:var(--blue-600)}
.plan-delete:hover{color:var(--red-600)}
.plan-add-child{font-size:12px;color:var(--text-3);padding:6px 0 6px 24px;cursor:pointer;border:none;background:none;font-family:var(--font);display:block;width:100%;text-align:left}
.plan-add-child:hover{color:var(--blue-600)}
.plan-modal{padding-top:0}
.plan-modal .form-group{margin-bottom:12px}
.plan-modal .form-group label{font-size:12px;color:var(--text-2);display:block;margin-bottom:4px}
.plan-modal input,.plan-modal textarea,.plan-modal select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:var(--font);color:var(--text)}
.plan-modal textarea{min-height:80px;resize:vertical}
.plan-modal .form-row{display:flex;gap:8px}
.plan-modal .form-row>*{flex:1}
.fab{display:none;position:fixed;bottom:90px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--blue-600);color:#fff;border:none;cursor:pointer;z-index:100;font-family:var(--font);box-shadow:0 4px 12px rgba(24,95,165,.35);align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.fab:active{transform:scale(.92);box-shadow:0 2px 8px rgba(24,95,165,.3)}
.mobile-tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.mobile-tab{flex:1;text-align:center;padding:10px 0 12px;font-size:14px;color:var(--text-3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center}
.mobile-tab-icon{font-size:20px;line-height:1}
.mobile-tab.active{color:var(--blue-600);font-weight:500}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:20px;width:90%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text-2);margin-bottom:4px;display:block}
.form-input,.form-select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:var(--font);color:var(--text);background:var(--surface)}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--blue-400)}
textarea.form-input{resize:vertical;min-height:40px}
.form-row{display:flex;gap:10px}
.form-row>.form-group{flex:1}
.form-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 12px;border-radius:16px;border:1px solid var(--border);cursor:pointer;color:var(--text-2)}
.chip.active{background:var(--blue-50);border-color:var(--blue-400);color:var(--blue-600);font-weight:500}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn-cancel{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text-2);font-family:var(--font)}
.btn-save{background:var(--blue-600);color:#fff;border:none;border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer;font-weight:500;font-family:var(--font)}
.btn-save:hover{background:var(--blue-800)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty-state-title{font-size:14px;margin-bottom:4px}
@media(max-width:768px){
.app-body{grid-template-columns:1fr}
.sidebar{display:none}.right-panel{display:none}
.mobile-tabs{display:flex}.fab{display:flex}
.main{padding:12px;padding-bottom:100px}
.filter-chips{display:flex}
.topbar{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
.topbar-title{font-size:15px}.btn-add{padding:5px 10px;font-size:12px}
.task-delete{opacity:1}
.task-edit{opacity:1}
.task-card{padding:12px 14px}
.task-checkbox{width:22px;height:22px}
.mobile-stats{display:block}
.calendar-day{min-height:38px;font-size:11px}
.mobile-tab{font-size:11px;padding:8px 0 10px}
.mobile-tab-icon{font-size:18px}
.task-card-info{padding-left:32px}
}
.repeat-end-date{display:none;margin-top:8px}
.repeat-end-date.show{display:block}
/* Task card two-line layout */
.task-card{flex-direction:column;align-items:stretch;gap:0!important}
.task-card-row1{display:flex;align-items:center;gap:10px}
.task-card-info{display:flex;align-items:center;gap:8px;padding-left:28px;margin-top:3px;flex-wrap:wrap}
.task-card-info .task-meta{font-size:11px}
.task-card-info .task-meta-date{color:var(--blue-600);font-weight:500}
.task-card-info .task-meta-overdue{color:var(--red-600);font-weight:500}
/* News section */
.news-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-top:16px}
.news-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.news-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.news-tabs{display:flex;gap:4px;flex-wrap:wrap}
.news-tab{font-size:12px;padding:3px 10px;border-radius:14px;border:1px solid var(--border);cursor:pointer;color:var(--text-2);transition:all .15s}
.news-tab.active{background:var(--blue-50);border-color:var(--blue-400);color:var(--blue-600);font-weight:500}
.news-tab:hover:not(.active){background:var(--surface-3)}
.news-list{max-height:320px;overflow-y:auto}
.news-item{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:var(--surface-3)}
.news-rank{font-size:13px;font-weight:700;color:var(--text-3);width:22px;text-align:center;flex-shrink:0}
.news-item:nth-child(1) .news-rank{color:var(--red-400)}
.news-item:nth-child(2) .news-rank{color:var(--coral-400)}
.news-item:nth-child(3) .news-rank{color:var(--amber-400)}
.news-item-title{flex:1;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-item-hot{font-size:11px;color:var(--text-3);flex-shrink:0}
.news-loading{text-align:center;padding:20px;color:var(--text-3);font-size:13px}
.news-error{text-align:center;padding:20px;color:var(--text-3);font-size:13px}
.news-refresh{font-size:11px;color:var(--blue-600);cursor:pointer;border:none;background:transparent;font-family:var(--font)}
.news-refresh:hover{text-decoration:underline}
/* Overdue / historical tasks */
.overdue-section{margin-top:16px}
.overdue-section .section-title{color:var(--red-600)}
.overdue-badge{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:500;background:var(--red-50);color:var(--red-600);white-space:nowrap;flex-shrink:0}
.historical-list .task-card{border-left:3px solid var(--red-400)}
/* Calendar completed day */
.calendar-day.all-done{background:var(--teal-50)}
.calendar-day.all-done::before{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--teal-400)}
.calendar-day .day-done-count{font-size:9px;color:var(--teal-600);margin-top:1px}
/* Completed tasks in calendar day view */
.completed-day-header{font-size:13px;color:var(--teal-600);font-weight:500;margin:12px 0 6px;display:flex;align-items:center;gap:6px}

<script>
var STORAGE_KEY = 'gaoxiaorong_workbench_v1';

var state = {tasks:[],plans:[],currentView:'today',currentModule:null,currentCategory:null,calendarDate:new Date(),selectedDate:null,newsData:null,newsLoading:false,currentNewsSource:'toutiao',newsError:null,moduleDateFilter:'today',moduleCustomDate:null,planYear:new Date().getFullYear(),planEditId:null,planEditMode:'add',deleteConfirmTaskId:null,deleteConfirmTaskTitle:'',deleteConfirmDate:''};
var modalState = {module:'work',priority:'medium',repeat:'none',editingId:null};

  {key:'toutiao',name:'头条热点',url:'https://dailyhotapi.3yu3.top/toutiao'},

];

function loadData(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{var d=JSON.parse(raw);state.tasks=d.tasks||[]}catch(e){state.tasks=[]}
    state.tasks.forEach(function(t){
      if(t.completed&&!t.completedDate)t.completedDate=t.date;
      if(!t.completedDates)t.completedDates=[];
      if(!t.skippedDates)t.skippedDates=[];
    });
  } else {
    initSampleData();
  }
  loadPlans();
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks:state.tasks}));
}
function loadPlans(){
  var raw=localStorage.getItem(PLANS_STORAGE_KEY);
  if(raw){try{state.plans=JSON.parse(raw)}catch(e){state.plans=[]}} else state.plans=[];
}
function savePlans(){localStorage.setItem(PLANS_STORAGE_KEY, JSON.stringify(state.plans));}
function getWeekStart(d){
  var day=d.getDay();var diff=d.getDate()-day+(day===0?-6:1);
  var m=new Date(d);m.setDate(diff);return m;
}
function fmtWeekLabel(start){
  var end=new Date(start);end.setDate(start.getDate()+6);
  var ms=start.getMonth()+1,es=end.getMonth()+1,ds=start.getDate(),de=end.getDate();
  var weekNum=Math.ceil((start.getDate()-1+7)/7);
  var firstDay=new Date(start.getFullYear(),start.getMonth(),1);
  var firstMonday=new Date(firstDay);firstMonday.setDate(1-(firstDay.getDay()===0?6:firstDay.getDay()-1));
  if(firstMonday>firstDay){var offset=firstMonday-firstDay;weekNum=Math.ceil((start-firstDay+1)/86400000/7)}
  var mondayOfYear=new Date(start.getFullYear(),0,1);
  var daysSinceMonday=(start-mondayOfYear)/86400000;
  var firstMondayOfYear=new Date(mondayOfYear);firstMondayOfYear.setDate(1-(mondayOfYear.getDay()===0?6:mondayOfYear.getDay()-1));
  var wk=Math.floor((start-firstMondayOfYear)/86400000/7)+1;
  if(wk<1)wk=52;
  return {label:'第'+wk+'周',start:fmtDate(start),end:fmtDate(end),range:ms+'/'+ds+'-'+es+'/'+de};
}
function addPlan(type,parentId,parentInfo){
  state.planEditId=null;state.planEditMode='add';
  state._planParentId=parentId||null;
  state._planParentTitle=parentInfo||'';
  document.getElementById('planType').value=type;
  document.getElementById('planTitle').value='';
  document.getElementById('planContent').value='';
  document.getElementById('planYear').value=state.planYear;
  document.getElementById('planStatus').value='pending';
  document.getElementById('planProgress').value='0';
  var now=new Date();
  document.getElementById('planMonth').value=now.getMonth()+1;
  var ws=getWeekStart(now);
  document.getElementById('planWeekStart').value=fmtDate(ws);
  var isYear=(type==='year'),isMonth=(type==='month');
  document.getElementById('planType').disabled=(parentId!==null);
  document.getElementById('planMonthGroup').style.display=isMonth?'block':'none';
  document.getElementById('planWeekGroup').style.display=(type==='week')?'block':'none';
  document.getElementById('planParentGroup').style.display=parentId?'block':'none';
  document.getElementById('planParentDisplay').value=state._planParentTitle||'';
  document.getElementById('planProgressGroup').style.display=(type==='week')?'none':'block';
  document.getElementById('planModalTitle').textContent='添加'+(type==='year'?'年度':type==='month'?'月度':'周')+'计划';
  document.getElementById('planModalOverlay').classList.add('show');
}
function editPlan(id){
  var p=null;for(var i=0;i<state.plans.length;i++){if(state.plans[i].id===id){p=state.plans[i];break}}
  if(!p)return;
  state.planEditId=id;state.planEditMode='edit';
  state._planParentId=p.parentId||null;
  document.getElementById('planType').value=p.type;
  document.getElementById('planType').disabled=true;
  document.getElementById('planTitle').value=p.title;
  document.getElementById('planContent').value=p.content||'';
  document.getElementById('planYear').value=p.year;
  document.getElementById('planStatus').value=p.status;
  document.getElementById('planProgress').value=p.progress||0;
  document.getElementById('planMonthGroup').style.display=(p.type==='month'||p.type==='week')?'block':'none';
  document.getElementById('planWeekGroup').style.display=(p.type==='week')?'block':'none';
  document.getElementById('planProgressGroup').style.display=(p.type==='week')?'none':'block';
  if(p.type==='month'||p.type==='week')document.getElementById('planMonth').value=p.month||(new Date().getMonth()+1);
  if(p.type==='week')document.getElementById('planWeekStart').value=p.weekStart||getTodayStr();
  if(p.parentId){
    var pp=null;for(var j=0;j<state.plans.length;j++){if(state.plans[j].id===p.parentId){pp=state.plans[j];break}}
    document.getElementById('planParentGroup').style.display='block';
    document.getElementById('planParentDisplay').value=pp?pp.title:'';
  } else {
    document.getElementById('planParentGroup').style.display='none';
  }
  document.getElementById('planModalTitle').textContent='编辑计划';
  document.getElementById('planModalOverlay').classList.add('show');
}
function savePlan(){
  var type=document.getElementById('planType').value;
  var title=document.getElementById('planTitle').value.trim();
  if(!title){alert('请输入计划标题');return}
  var year=parseInt(document.getElementById('planYear').value)||state.planYear;
  var plan={
    id:state.planEditId||Date.now(),
    type:type,
    parentId:state._planParentId||null,
    year:year,
    month:null,
    weekLabel:null,weekStart:null,weekEnd:null,
    title:title,
    content:document.getElementById('planContent').value.trim(),
    status:document.getElementById('planStatus').value,
    progress:type==='week'?0:parseInt(document.getElementById('planProgress').value)||0,
    sortOrder:0,
    expanded:true
  };
  if(type==='month'||type==='week'){
    plan.month=parseInt(document.getElementById('planMonth').value);
    plan.year=year;
  }
  if(type==='week'){
    var ws=new Date(document.getElementById('planWeekStart').value);
    var wl=fmtWeekLabel(ws);
    plan.weekLabel=wl.label;plan.weekStart=wl.start;plan.weekEnd=wl.end;
    plan.progress=0;
  }
  if(state.planEditId){
    for(var i=0;i<state.plans.length;i++){if(state.plans[i].id===state.planEditId){Object.assign(state.plans[i],plan);break}}
  } else {
    state.plans.push(plan);
  }
  if(plan.parentId){var pp=null;for(var k=0;k<state.plans.length;k++){if(state.plans[k].id===plan.parentId){pp=state.plans[k];break}}if(pp){pp.expanded=true}}
  savePlans();
  closePlanModal();
  render();
}
function deletePlan(id){
  if(!confirm('确定删除此计划及其子计划吗？'))return;
  state.plans=state.plans.filter(function(p){return p.id!==id&&p.parentId!==id});
  savePlans();render();
}
function closePlanModal(){
  document.getElementById('planModalOverlay').classList.remove('show');
  state.planEditId=null;
}
function togglePlanExpand(id){
  for(var i=0;i<state.plans.length;i++){if(state.plans[i].id===id){state.plans[i].expanded=!state.plans[i].expanded;break}}
  savePlans();render();
}

  state.tasks = [

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getTodayStr(){return fmtDate(new Date())}
function getWeekday(d){var w=['日','一','二','三','四','五','六'];return '周'+w[d.getDay()]}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function taskOnDate(task,dateStr){
  if(task.repeat==='none'||!task.repeat)return task.date===dateStr;
  if(task.skippedDates&&task.skippedDates.indexOf(dateStr)>=0)return false;
  if(task.date>dateStr)return false;
  if(task.repeatEndDate&&task.repeatEndDate<dateStr)return false;
  if(task.repeat==='daily')return true;
  if(task.repeat==='weekly')return new Date(task.date).getDay()===new Date(dateStr).getDay();
  if(task.repeat==='monthly')return new Date(task.date).getDate()===new Date(dateStr).getDate();
  return false;
}
function isTaskDoneOnDate(task,dateStr){
  if(task.repeat==='none'||!task.repeat)return task.completed;
  if(task.completedDates)return task.completedDates.indexOf(dateStr)>=0;
  if(task.completed&&task.date===dateStr)return true;
  return false;
}
function taskInDateRange(task,startDate,endDate){
  if(task.repeat==='none'||!task.repeat){
    return task.date>=startDate&&task.date<=endDate;
  }
  if(task.date>endDate)return false;
  if(task.repeatEndDate&&task.repeatEndDate<startDate)return false;
  if(task.repeat==='daily')return task.date<=endDate;
  if(task.repeat==='weekly'){
    var taskDay=new Date(task.date).getDay();
    var d=new Date(startDate);
    while(fmtDate(d)<=endDate){
      if(d.getDay()===taskDay&&fmtDate(d)>=task.date)return true;
      d.setDate(d.getDate()+1);
    }
    return false;
  }
  if(task.repeat==='monthly'){
    var taskDom=new Date(task.date).getDate();
    var sd=new Date(startDate),ed=new Date(endDate);
    var d=new Date(sd.getFullYear(),sd.getMonth(),1);
    while(d<=ed){
      var td=new Date(d.getFullYear(),d.getMonth(),taskDom);
      if(td>=sd&&td<=ed&&fmtDate(td)>=task.date)return true;
      d.setMonth(d.getMonth()+1);
    }
    return false;
  }
  return false;
}
function getModuleDateRange(){
  var filter=state.moduleDateFilter;
  if(filter==='custom'&&state.moduleCustomDate){
    return{start:state.moduleCustomDate,end:state.moduleCustomDate};
  }
  if(filter==='all')return null;
  var now=new Date();
  if(filter==='today'){
    var ts=getTodayStr();return{start:ts,end:ts};
  }
  if(filter==='week'){
    var ws=new Date(now);ws.setDate(now.getDate()-now.getDay());
    var we=new Date(ws);we.setDate(ws.getDate()+6);
    return{start:fmtDate(ws),end:fmtDate(we)};
  }
  if(filter==='month'){
    var ms=new Date(now.getFullYear(),now.getMonth(),1);
    var me=new Date(now.getFullYear(),now.getMonth()+1,0);
    return{start:fmtDate(ms),end:fmtDate(me)};
  }
  if(filter==='year'){
    return{start:now.getFullYear()+'-01-01',end:now.getFullYear()+'-12-31'};
  }
  var ts2=getTodayStr();return{start:ts2,end:ts2};
}
function getViewDate(){
  if(state.currentView==='calendar'&&state.selectedDate)return state.selectedDate;
  return getTodayStr();
}
function getOverdueTasks(){
  var todayStr=getTodayStr();
  var result=[];
  state.tasks.forEach(function(t){
    if(t.repeat==='none'||!t.repeat){
      if(!t.completed&&t.date<todayStr)result.push(t);
    } else {
      if(!isTaskDoneOnDate(t,todayStr)&&taskOnDate(t,todayStr)){
        var lastDate=getLastRepeatDateBefore(t,todayStr);
        if(lastDate)result.push(Object.assign({},t,{_overdueDate:lastDate,_isRepeatOverdue:true}));
      }
    }
  });
  var po={high:0,medium:1,low:2};
  result.sort(function(a,b){if(po[a.priority]!==po[b.priority])return po[a.priority]-po[b.priority];return a.date.localeCompare(b.date)});
  return result;
}
function getLastRepeatDateBefore(task,beforeDate){
  if(task.repeat==='daily'){
    if(!task.completedDates||task.completedDates.length===0)return task.date;
    var sorted=task.completedDates.slice().sort();
    var lastDone=sorted[sorted.length-1];
    var d=new Date(lastDone);d.setDate(d.getDate()+1);
    while(fmtDate(d)<beforeDate){
      var ds=fmtDate(d);
      if(!(task.skippedDates&&task.skippedDates.indexOf(ds)>=0))return ds;
      d.setDate(d.getDate()+1);
    }
    var d2=new Date(beforeDate);d2.setDate(d2.getDate()-1);
    return fmtDate(d2);
  }
  if(task.repeat==='weekly'){
    var taskDay=new Date(task.date).getDay();
    if(!task.completedDates||task.completedDates.length===0)return task.date;
    var sorted=task.completedDates.slice().sort();
    var lastDone=sorted[sorted.length-1];
    var d=new Date(lastDone);d.setDate(d.getDate()+1);
    while(d.getDay()!==taskDay)d.setDate(d.getDate()+1);
    while(fmtDate(d)<beforeDate){
      var ds=fmtDate(d);
      if(!(task.skippedDates&&task.skippedDates.indexOf(ds)>=0))return ds;
      d.setDate(d.getDate()+7);
    }
    var td=new Date(beforeDate);var wd=td.getDay();
    var diff=(wd-taskDay+7)%7;
    td.setDate(td.getDate()-diff);
    if(fmtDate(td)===beforeDate)td.setDate(td.getDate()-7);
    return fmtDate(td);
  }
  if(task.repeat==='monthly'){
    var day=new Date(task.date).getDate();
    if(!task.completedDates||task.completedDates.length===0)return task.date;
    var sorted=task.completedDates.slice().sort();
    var lastDone=sorted[sorted.length-1];
    var d=new Date(lastDone);d.setMonth(d.getMonth()+1);
    while(new Date(d.getFullYear(),d.getMonth(),day).getDate()!==day)d.setMonth(d.getMonth()+1);
    var cur=new Date(d.getFullYear(),d.getMonth(),day);
    while(fmtDate(cur)<beforeDate){
      var ds=fmtDate(cur);
      if(!(task.skippedDates&&task.skippedDates.indexOf(ds)>=0))return ds;
      cur.setMonth(cur.getMonth()+1);
      while(new Date(cur.getFullYear(),cur.getMonth(),day).getDate()!==day)cur.setMonth(cur.getMonth()+1);
    }
    var d2=new Date(beforeDate);
    if(d2.getDate()===day)d2.setMonth(d2.getMonth()-1);
    while(new Date(d2.getFullYear(),d2.getMonth(),day).getDate()!==day)d2.setMonth(d2.getMonth()-1);
    return fmtDate(new Date(d2.getFullYear(),d2.getMonth(),day));
  }
  return task.date;
}
function getCompletedTasksOnDate(dateStr){
  var result=[];
  state.tasks.forEach(function(t){
    if(t.repeat==='none'||!t.repeat){
      if(t.completed&&t.completedDate===dateStr)result.push(t);
    } else {
      if(t.completedDates&&t.completedDates.indexOf(dateStr)>=0)result.push(t);
    }
  });
  return result;
}
function isDayAllDone(dateStr){
  var scheduled=state.tasks.filter(function(x){return taskOnDate(x,dateStr)});
  if(scheduled.length===0)return false;
  return scheduled.every(function(x){return isTaskDoneOnDate(x,dateStr)});
}
async function fetchNews(){
  if(state.newsLoading)return;
  state.newsLoading=true;state.newsError=null;
  if(!state.newsData)state.newsData={};
  renderNews();
  var src=NEWS_SOURCES.find(function(s){return s.key===state.currentNewsSource});
  if(!src){state.newsLoading=false;return}
  if(state.newsData[src.key]&&state.newsData[src.key].length>0){
    state.newsLoading=false;renderNews();return;
  }
  var urls=[
    src.url,
    'https://api.allorigins.win/raw?url='+encodeURIComponent(src.url),
    'https://corsproxy.io/?url='+encodeURIComponent(src.url)
  ];
  var success=false;
  for(var i=0;i<urls.length&&!success;i++){
    try{
      var fo={};
      if(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)fo.signal=AbortSignal.timeout(8000);
      var resp=await fetch(urls[i],fo);
      var data=await resp.json();
      var items=[];
      if(Array.isArray(data)){items=data}
      else if(data&&Array.isArray(data.data)){items=data.data}
      items=items.slice(0,15).map(function(it){
        return{title:it.title||'',hot:it.hot!=null?formatHot(it.hot):'',url:it.url||it.mobileUrl||'#'}
      });
      if(items.length>0){
        state.newsData[src.key]=items;
        success=true;
      }
    }catch(e){
      console.log('News fetch attempt '+(i+1)+' failed:',e.message);
    }
  }
  if(!success)state.newsError='加载失败，请稍后重试';
  state.newsLoading=false;
  renderNews();
}
function formatHot(h){
  if(typeof h==='string')return h;
  if(h>=100000000)return (h/100000000).toFixed(1)+'亿';
  if(h>=10000)return (h/10000).toFixed(1)+'万';
  return String(h);
}

    '<div class="task-card-row1">'+

    '<span class="task-tag '+tc+'">'+cn+'</span>'+
    '<span class="task-title">'+esc(task.title)+'</span>'+
    '<button class="task-edit" data-id="'+task.id+'">✎</button>'+
    '<button class="task-delete" data-id="'+task.id+'">&times;</button></div>';

    var d=new Date(task.date);

}
function renderCalendarMain(main){
  if(state.selectedDate){
    var tasks=state.tasks.filter(function(x){return taskOnDate(x,state.selectedDate)});
    var completedTasks=getCompletedTasksOnDate(state.selectedDate);
    var po={high:0,medium:1,low:2};
    tasks.sort(function(a,b){if(a.completed!==b.completed)return a.completed?1:-1;if(po[a.priority]!==po[b.priority])return po[a.priority]-po[b.priority];return(a.time||'99:99').localeCompare(b.time||'99:99')});
    var d=new Date(state.selectedDate);
    var html='<div class="section-title">'+(d.getMonth()+1)+'月'+d.getDate()+'日待办<span style="font-size:12px;font-weight:400;color:var(--text-3)">'+tasks.length+'项</span><button class="btn-add" style="margin-left:auto;font-size:12px;padding:4px 10px" id="btnBackCal">返回日历</button></div>';
    if(tasks.length===0){html+='<div class="empty-state"><div class="empty-state-title">该日暂无任务</div></div>'}else{tasks.forEach(function(t){html+=renderTaskCard(t,state.selectedDate)})}
    if(completedTasks.length>0){
      html+='<div class="completed-day-header">✅ 当天已完成 '+completedTasks.length+' 项</div>';
      completedTasks.forEach(function(t){
        var done=true;
        html+='<div class="task-card done" data-module="'+t.module+'">'+
          '<div class="task-card-row1">'+
          '<input type="checkbox" class="task-checkbox" data-id="'+t.id+'" checked />'+
          '<span class="task-tag tag-'+(t.module||'')+'">'+((MODULES[t.module]&&MODULES[t.module].categories[t.category])||(MODULES[t.module]&&MODULES[t.module].name)||t.module||'')+'</span>'+
          '<span class="task-title">'+esc(t.title)+'</span>'+
          '</div></div>';
      });
    }
    main.innerHTML=html;
    bindTaskEvents(main);
    document.getElementById('btnBackCal').addEventListener('click',function(){state.selectedDate=null;render()});
    return;
  }
  var date=state.calendarDate;
  var year=date.getFullYear(),month=date.getMonth();
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var prevDays=new Date(year,month,0).getDate();
  var todayStr=getTodayStr();
  var html='<div class="calendar"><div class="calendar-header"><div class="calendar-title">'+year+'年'+(month+1)+'月</div><div class="calendar-nav"><button id="calPrev">&#8249;</button><button id="calToday">今</button><button id="calNext">&#8250;</button></div></div><div class="calendar-grid">';
  ['日','一','二','三','四','五','六'].forEach(function(d){html+='<div class="calendar-day-header">'+d+'</div>'});
  for(var i=firstDay-1;i>=0;i--)html+='<div class="calendar-day other-month">'+(prevDays-i)+'</div>';
  for(var day=1;day<=daysInMonth;day++){
    var ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var has=state.tasks.some(function(x){return taskOnDate(x,ds)});
    var allDone=isDayAllDone(ds);
    var hasCompleted=getCompletedTasksOnDate(ds).length>0;
    var cls='calendar-day'+(ds===todayStr?' today':'')+(has?' has-tasks':'')+(allDone?' all-done':'');
    html+='<div class="'+cls+'" data-date="'+ds+'">'+day+(hasCompleted?'<div class="day-done-count">✓</div>':'')+'</div>';
  }
  var total=firstDay+daysInMonth;var rem=(7-total%7)%7;
  for(var day2=1;day2<=rem;day2++)html+='<div class="calendar-day other-month">'+day2+'</div>';
  html+='</div></div>';
  main.innerHTML=html;
  document.getElementById('calPrev').addEventListener('click',function(){state.calendarDate.setMonth(state.calendarDate.getMonth()-1);render()});
  document.getElementById('calNext').addEventListener('click',function(){state.calendarDate.setMonth(state.calendarDate.getMonth()+1);render()});
  document.getElementById('calToday').addEventListener('click',function(){state.calendarDate=new Date();state.selectedDate=null;render()});
  main.querySelectorAll('.calendar-day[data-date]').forEach(function(el){el.addEventListener('click',function(){state.selectedDate=el.dataset.date;render()})});
}
function renderRightPanel(){
  var p=document.getElementById('rightPanel');
  var ts=getTodayStr();
  var now=new Date();var ws=new Date(now);ws.setDate(now.getDate()-now.getDay());
  var wtArr=[];
  for(var i=0;i<7;i++){var wd=new Date(ws);wd.setDate(ws.getDate()+i);var ds=fmtDate(wd);state.tasks.forEach(function(x){if(taskOnDate(x,ds))wtArr.push({task:x,date:ds})})}
  var wd2=wtArr.filter(function(x){return isTaskDoneOnDate(x.task,x.date)}).length;
  var wr=wtArr.length>0?Math.round(wd2/wtArr.length*100):0;
  var ms={work:0,children:0,life:0};
  wtArr.forEach(function(x){ms[x.task.module]=(ms[x.task.module]||0)+1});
  var rem=state.tasks.filter(function(x){
    if(x.priority!=='high')return false;
    if(x.repeat==='none'||!x.repeat)return!x.completed&&x.date<=ts;
    return!isTaskDoneOnDate(x,ts)&&taskOnDate(x,ts);
  });
  var h='';
  var wrFill=wr>=100?'complete':'';
  h+='<div class="stat-card"><div style="display:flex;align-items:baseline;justify-content:space-between"><span class="stat-number">'+wr+'%</span><span class="stat-label">'+wd2+'/'+wtArr.length+'</span></div><div class="stat-label" style="margin-top:2px">本周完成率</div><div class="progress-track" style="margin-top:8px;height:8px"><div class="progress-fill '+wrFill+'" style="width:'+wr+'%"></div></div></div>';
  h+='<div class="stat-card"><div class="stat-number">'+wd2+'<span style="font-size:14px;color:var(--text-3)"> / '+wtArr.length+'</span></div><div class="stat-label">本周完成任务数</div></div>';
  h+='<div class="stat-card"><div class="stat-label" style="font-weight:600;margin-bottom:8px">模块分布</div><div class="stat-bar"><div style="flex:'+(ms.work||0)+';background:#378ADD"></div><div style="flex:'+(ms.children||0)+';background:#1D9E75"></div><div style="flex:'+(ms.life||0)+';background:#D85A30"></div></div><div class="stat-legend"><span style="color:#0C447C">工作 '+ms.work+'</span><span style="color:#085041">孩子 '+ms.children+'</span><span style="color:#712B13">生活 '+ms.life+'</span></div></div>';
  if(rem.length>0){
    h+='<div class="reminder-card"><div class="reminder-title">重要提醒</div>';
    rem.forEach(function(r){var rm=MODULES[r.module];var cn=(rm&&rm.categories[r.category])||(rm&&rm.name)||r.module||'';h+='<div class="reminder-item">'+cn+' &middot; '+esc(r.title)+(r.time?' '+r.time:'')+'</div>'});
    h+='</div>';
  }
  p.innerHTML=h;
}
function toggleTask(id,dateStr){
  var t=state.tasks.find(function(x){return x.id===id});
  if(!t)return;
  if(t.repeat==='none'||!t.repeat){
    t.completed=!t.completed;
    if(t.completed){t.completedDate=getTodayStr()}else{t.completedDate=null}
  }
  else{
    if(!t.completedDates)t.completedDates=[];
    var idx=t.completedDates.indexOf(dateStr);
    if(idx>=0)t.completedDates.splice(idx,1);else t.completedDates.push(dateStr);
  }
  saveData();render();
}
function deleteTask(id){
  var t=state.tasks.find(function(x){return x.id===id});
  if(!t)return;
  if(t.repeat&&t.repeat!=='none'){
    state.deleteConfirmTaskId=id;
    state.deleteConfirmTaskTitle=t.title;
    state.deleteConfirmDate=getViewDate();
    showDeleteConfirmPopup();
    return;
  }
  state.tasks=state.tasks.filter(function(x){return x.id!==id});
  saveData();render();
}
function skipRecurringOnDate(taskId,dateStr){
  var t=state.tasks.find(function(x){return x.id===taskId});
  if(!t)return;
  if(!t.skippedDates)t.skippedDates=[];
  t.skippedDates.push(dateStr);
  if(t.completedDates){t.completedDates=t.completedDates.filter(function(d){return d!==dateStr})}
  saveData();render();
}
function showDeleteConfirmPopup(){
  var rm={daily:'每日',weekly:'每周',monthly:'每月'};
  var rn=rm[state.tasks.find(function(x){return x.id===state.deleteConfirmTaskId}).repeat]||'重复';
  var html='<div class="delete-confirm-overlay" id="deleteConfirmOverlay">';
  html+='<div class="delete-confirm-popup">';
  html+='<div class="dcp-title">删除「'+esc(state.deleteConfirmTaskTitle)+'」</div>';
  html+='<div class="dcp-sub">此任务为"'+rn+'"重复，你想怎么处理？</div>';
  html+='<div class="dcp-btns">';
  html+='<button class="dcp-btn dcp-btn-skip" id="dcpSkipBtn">仅删除今天</button>';
  html+='<button class="dcp-btn dcp-btn-cancel" id="dcpCancelAllBtn">取消整个重复任务</button>';
  html+='</div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
  document.getElementById('dcpSkipBtn').addEventListener('click',function(){
    skipRecurringOnDate(state.deleteConfirmTaskId,state.deleteConfirmDate);
    removeDeleteConfirmPopup();
  });
  document.getElementById('dcpCancelAllBtn').addEventListener('click',function(){
    state.tasks=state.tasks.filter(function(x){return x.id!==state.deleteConfirmTaskId});
    saveData();removeDeleteConfirmPopup();render();
  });
  document.getElementById('deleteConfirmOverlay').addEventListener('click',function(e){
    if(e.target===document.getElementById('deleteConfirmOverlay'))removeDeleteConfirmPopup();
  });
}
function removeDeleteConfirmPopup(){
  var el=document.getElementById('deleteConfirmOverlay');
  if(el)el.remove();
  state.deleteConfirmTaskId=null;
}
function switchView(view,module,category){
  state.currentView=view;state.currentModule=module||null;state.currentCategory=category||null;state.selectedDate=null;
  if(view==='module'){state.moduleDateFilter='today';state.moduleCustomDate=null}
  if(view==='plan'){state.planYear=new Date().getFullYear()}
  render();
}
function selectModalModule(m){
  modalState.module=m;
  document.querySelectorAll('[data-modal-module]').forEach(function(el){el.classList.toggle('active',el.dataset.modalModule===m)});
  var sel=document.getElementById('taskCategory');sel.innerHTML='';
  Object.keys(MODULES[m].categories).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=MODULES[m].categories[k];sel.appendChild(o)});
}
function selectModalPriority(p){modalState.priority=p;document.querySelectorAll('[data-modal-priority]').forEach(function(el){el.classList.toggle('active',el.dataset.modalPriority===p)})}
function selectModalRepeat(r){
  modalState.repeat=r;
  document.querySelectorAll('[data-modal-repeat]').forEach(function(el){el.classList.toggle('active',el.dataset.modalRepeat===r)});
  var ed=document.getElementById('repeatEndDateGroup');
  if(r!=='none'){ed.classList.add('show')}else{ed.classList.remove('show')}
}
function editTask(id){
  var t=state.tasks.find(function(x){return x.id===id});
  if(!t)return;
  modalState.editingId=id;
  document.getElementById('modalTitle').textContent='编辑任务';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('taskTitle').value=t.title;
  document.getElementById('taskDate').value=t.date;
  document.getElementById('taskTime').value=t.time||'';
  document.getElementById('taskNote').value=t.note||'';
  selectModalModule(t.module);selectModalPriority(t.priority);selectModalRepeat(t.repeat);
  var sel=document.getElementById('taskCategory');sel.value=t.category;
  document.getElementById('taskRepeatEndDate').value=t.repeatEndDate||'';
  setTimeout(function(){document.getElementById('taskTitle').focus()},50);
}
function openModal(){
  modalState.editingId=null;
  document.getElementById('modalTitle').textContent='添加任务';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('taskTitle').value='';
  document.getElementById('taskDate').value=getTodayStr();
  document.getElementById('taskTime').value='';
  document.getElementById('taskNote').value='';
  document.getElementById('taskRepeatEndDate').value='';
  selectModalModule('work');selectModalPriority('medium');selectModalRepeat('none');
  setTimeout(function(){document.getElementById('taskTitle').focus()},50);
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
function saveTask(){
  var title=document.getElementById('taskTitle').value.trim();
  if(!title){document.getElementById('taskTitle').focus();return}
  if(modalState.editingId){
    var t=state.tasks.find(function(x){return x.id===modalState.editingId});
    if(t){
      t.title=title;t.module=modalState.module;t.category=document.getElementById('taskCategory').value;
      t.priority=modalState.priority;t.date=document.getElementById('taskDate').value;t.time=document.getElementById('taskTime').value;
      t.repeat=modalState.repeat;t.note=document.getElementById('taskNote').value.trim();
      t.repeatEndDate=document.getElementById('taskRepeatEndDate').value||null;
    }
  } else {
    state.tasks.push({
      id:Date.now(),title:title,module:modalState.module,category:document.getElementById('taskCategory').value,
      priority:modalState.priority,date:document.getElementById('taskDate').value,time:document.getElementById('taskTime').value,
      repeat:modalState.repeat,completed:false,completedDate:null,note:document.getElementById('taskNote').value.trim(),
      completedDates:[],skippedDates:[],repeatEndDate:document.getElementById('taskRepeatEndDate').value||null
    });
  }
  saveData();closeModal();render();
}
function init(){
  loadData();render();
  document.getElementById('btnAdd').addEventListener('click',openModal);
  document.getElementById('btnSaveTask').addEventListener('click',saveTask);
  document.getElementById('btnCancel').addEventListener('click',closeModal);
  document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal()});
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.addEventListener('click',function(){
      var v=el.dataset.view,mn=el.dataset.moduleNav,m=el.dataset.module,c=el.dataset.category;
      if(v)switchView(v);else if(mn)switchView('module',mn);else if(c&&m)switchView('module',m,c);
    });
  });
  document.querySelectorAll('.mobile-tab').forEach(function(el){
    el.addEventListener('click',function(){
      var t=el.dataset.tab;
      if(t==='today')switchView('today');else if(t==='history')switchView('history');else if(t==='calendar')switchView('calendar');else if(t==='plan')switchView('plan');else switchView('module',t);
    });
  });
  document.getElementById('fab').addEventListener('click',openModal);
  document.querySelectorAll('[data-modal-module]').forEach(function(el){el.addEventListener('click',function(){selectModalModule(el.dataset.modalModule)})});
  document.querySelectorAll('[data-modal-priority]').forEach(function(el){el.addEventListener('click',function(){selectModalPriority(el.dataset.modalPriority)})});
  document.querySelectorAll('[data-modal-repeat]').forEach(function(el){el.addEventListener('click',function(){selectModalRepeat(el.dataset.modalRepeat)})});
  document.getElementById('taskTitle').addEventListener('keydown',function(e){if(e.key==='Enter')saveTask()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closePlanModal()}});
  document.getElementById('btnSavePlan').addEventListener('click',savePlan);
  document.getElementById('btnPlanCancel').addEventListener('click',closePlanModal);
  document.getElementById('planModalOverlay').addEventListener('click',function(e){if(e.target===e.currentTarget)closePlanModal()});
  document.getElementById('planType').addEventListener('change',function(){
    var t=this.value;
    document.getElementById('planMonthGroup').style.display=(t==='month'||t==='week')?'block':'none';
    document.getElementById('planWeekGroup').style.display=(t==='week')?'block':'none';
    document.getElementById('planProgressGroup').style.display=(t==='week')?'none':'block';
  });
}
init();
</script>
</body>
</html>
